<body class="popup">
  <h2>Project Atlas</h2>
  <div class="status" id="helper">Connecting to Project Atlas...</div>
  <div class="row">
    <span>This page</span>

    <input type="checkbox" id="auto">

  <script src="popup.js"></script>
</body>
