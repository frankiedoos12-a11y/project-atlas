<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Project Atlas</title>
  <link rel="icon" href="icons/32.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <header>
      <img src="icons/48.png" alt="" width="40" height="40">
      <div>
        <div class="brand">Project Atlas</div>
        <h1 id="title">Checking...</h1>
      </div>
    </header>
    <p class="url" id="url"></p>
    <ul id="reasons"></ul>
    <div class="buttons">
      <button id="back" class="primary">Go back to safety</button>
      <a id="vt" target="_blank" rel="noopener" hidden>View on VirusTotal</a>
      <button id="continue" class="quiet" hidden>Continue anyway</button>
      <button id="trust" class="quiet" hidden>Always trust this site</button>
      <button id="open" class="quiet" hidden>Open link</button>
    </div>
    <p class="footer" id="report-line" hidden>Atlas got this wrong? <a id="report" target="_blank" rel="noopener">Report a mistake</a></p>
  </main>
  <script src="warning.js"></script>
</body>
</html>
